<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quản lý nhân viên</title>
    <link rel="stylesheet" href="nhanvien.css" />
</head>

<body>
    <div class="container">
        <div class="card">
            <div class="topbar">
                <div>
                    <h1>Quản lý nhân viên</h1>
                    <p class="sub">Thêm và xem danh sách nhân viên</p>
                </div>
                <button id="logoutBtn" class="danger">Đăng xuất</button>
            </div>

            <div class="info-box">
                <p><strong>Người dùng:</strong> <span id="userInfo"></span></p>
            </div>
        </div>

        <div class="nav-links">
            <a href="dashboard.html" class="nav-btn">Tổng quan</a>
            <a href="nhanvien.html" class="nav-btn active" id="navNhanVien">Nhân viên</a>
            <a href="congviec.html" class="nav-btn">Công việc</a>
            <a href="chatbot.html" class="nav-btn">Chatbot</a>
        </div>

        <label for="searchNhanVien">Tìm kiếm nhân viên</label>
        <input type="text" id="searchNhanVien" placeholder="Nhập tên hoặc email..." />

        <button id="showAddNhanVienBtn" class="secondary">Thêm nhân viên</button>

        <div class="card" id="nhanVienFormCard" style="display:none;">
            <h2 id="nhanVienFormTitle">Thêm nhân viên mới</h2>

            <label for="tenNhanVien">Tên</label>
            <input type="text" id="tenNhanVien" placeholder="Nhập tên nhân viên" />

            <label for="emailNhanVien">Email</label>
            <input type="email" id="emailNhanVien" placeholder="Nhập email" />

            <label for="matkhauNhanVien">Mật khẩu</label>
            <input type="text" id="matkhauNhanVien" placeholder="Nhập mật khẩu" />

            <label for="roleNhanVien">Vai trò</label>
            <select id="roleNhanVien">
                <option value="staff">staff</option>
                <option value="admin">admin</option>
            </select>

            <button id="addNhanVienBtn">Thêm nhân viên</button>
            <button id="cancelNhanVienBtn" style="display:none;" class="secondary">Hủy sửa</button>
            <p id="nhanVienMessage" class="message"></p>
        </div>

        <div class="card">
            <div class="section-header">
                <h2>Danh sách nhân viên</h2>
            </div>
            <div id="nhanVienList" class="list-box"></div>
        </div>
    </div>

    <script src="nhanvien.js"></script>
</body>

</html>
