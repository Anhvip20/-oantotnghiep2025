<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quản lý nhân viên</title>
    <link rel="stylesheet" href="nhanvien.css" />
    <link rel="stylesheet" href="ai-assistant.css" />
</head>

<body>

    <div class="app-layout">

        <aside class="sidebar">

            <div class="sidebar-logo">
                <span class="menu-icon" id="toggleSidebar">☰</span>
                <span>💼 Quản lý công việc</span>
            </div>

            <nav class="sidebar-menu">

                <a href="dashboard.html" class="sidebar-link">
                    🏠 Tổng quan
                </a>

                <a href="nhanvien.html" class="sidebar-link active" id="navNhanVien">
                    👥 Nhân viên
                </a>

                <a href="congviec.html" class="sidebar-link">
                    📋 Công việc
                </a>

                <a href="chatbot.html" class="sidebar-link">
                    💬 Chatbot
                </a>

            </nav>

            <div class="sidebar-section">
                <p>TÀI KHOẢN</p>

                <a href="taikhoan.html" class="sidebar-link">
                    👤 Tài khoản
                </a>

                <button id="logoutBtn" class="sidebar-link sidebar-btn">
                    ↪ Đăng xuất
                </button>
            </div>

        </aside>

        <main class="main-content">

            <div class="container">

                <div class="card header-card">

                    <h1>Quản lý nhân viên</h1>

                    <p class="sub">
                        Thêm và xem danh sách nhân viên
                    </p>

                    <div class="info-box">
                        <p>
                            <strong>Người dùng:</strong>
                            <span id="userInfo"></span>
                        </p>
                    </div>

                </div>

                <div class="card toolbar-card">

                    <div class="filter-row">
                        <div class="filter-field">
                            <label for="searchNhanVien">
                                Tìm kiếm nhân viên
                            </label>

                            <input type="text" id="searchNhanVien" placeholder="Nhập tên, email hoặc số điện thoại..." />
                        </div>

                        <div class="filter-field filter-status">
                            <label for="workloadFilter">
                                Lọc tải công việc
                            </label>

                            <select id="workloadFilter">
                                <option value="all">Tất cả</option>
                                <option value="free">Đang rảnh</option>
                                <option value="normal">Bình thường</option>
                                <option value="busy">Đang bận</option>
                                <option value="overdue">Có việc quá hạn</option>
                            </select>
                        </div>

                        <div class="toolbar-action">
                            <button id="showAddNhanVienBtn" class="secondary">
                                Thêm nhân viên
                            </button>
                        </div>
                    </div>

                    <p id="employeeSummary" class="filter-summary"></p>

                </div>

                <div class="card" id="nhanVienFormCard" style="display:none;">

                    <h2 id="nhanVienFormTitle">
                        Thêm nhân viên mới
                    </h2>

                    <label for="tenNhanVien">Tên</label>

                    <input type="text" id="tenNhanVien" placeholder="Nhập tên nhân viên" />

                    <label for="emailNhanVien">
                        Email
                    </label>

                    <input type="email" id="emailNhanVien" placeholder="Nhập email" />

                    <label for="soDienThoaiNhanVien">
                        Số điện thoại
                    </label>

                    <input type="tel" id="soDienThoaiNhanVien" placeholder="Ví dụ: 0912345678" maxlength="10" />

                    <label for="gioiTinhNhanVien">
                        Giới tính
                    </label>

                    <select id="gioiTinhNhanVien">
                        <option value="Nam">Nam</option>
                        <option value="Nữ">Nữ</option>
                    </select>

                    <label for="matkhauNhanVien">
                        Mật khẩu
                    </label>

                    <input type="text" id="matkhauNhanVien" placeholder="Nhập mật khẩu" />

                    <label for="roleNhanVien">
                        Vai trò
                    </label>

                    <select id="roleNhanVien">
                        <option value="staff">
                            staff
                        </option>

                        <option value="admin">
                            admin
                        </option>
                    </select>

                    <button id="addNhanVienBtn">
                        Thêm nhân viên
                    </button>

                    <button id="cancelNhanVienBtn" class="secondary">

                        Đóng

                    </button>

                    <p id="nhanVienMessage" class="message"></p>

                </div>

                <div class="card">

                    <h2>Danh sách nhân viên</h2>

                    <div id="nhanVienList" class="list-box"></div>

                </div>

            </div>

        </main>

    </div>

    <a href="chatbot.html" class="ai-assistant-fab" aria-label="Mở trợ lý AI">
        <span class="ai-assistant-text">
            <small>AI</small>
            <span>Assistant</span>
        </span>
        <span class="ai-assistant-icon">AI</span>
    </a>

    <script src="ui-confirm.js"></script>
    <script src="nhanvien.js"></script>

</body>

</html>
