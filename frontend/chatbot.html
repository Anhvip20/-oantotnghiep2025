<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chatbot AI hỗ trợ công việc</title>
    <link rel="stylesheet" href="chatbot.css" />
</head>

<body>
    <div class="container">
        <div class="card">
            <div class="topbar">
                <div>
                    <h1>Chatbot AI hỗ trợ công việc</h1>
                    <p class="sub">Tra cứu thông tin và tóm tắt tình hình công việc</p>
                </div>
                <button id="logoutBtn" class="danger">Đăng xuất</button>
            </div>

            <div class="info-box">
                <p><strong>Người dùng:</strong> <span id="userInfo"></span></p>
            </div>
        </div>

        <div class="nav-links">
            <a href="dashboard.html" class="nav-btn">Tổng quan</a>
            <a href="nhanvien.html" class="nav-btn" id="navNhanVien">Nhân viên</a>
            <a href="congviec.html" class="nav-btn">Công việc</a>
            <a href="chatbot.html" class="nav-btn active">Chatbot</a>
        </div>

        <div class="card">
            <h2>Trò chuyện với AI</h2>

            <div id="chatBox" class="chat-box"></div>

            <label for="chatInput">Nhập câu hỏi</label>
            <textarea id="chatInput" class="chat-input"
                placeholder="Ví dụ: Tóm tắt ngắn tình hình công việc hiện tại trong 5 dòng"></textarea>

            <div class="chat-actions">
                <button id="sendChatBtn">Gửi</button>
                <button id="clearChatBtn" class="secondary">Xóa hội thoại</button>
            </div>

            <div class="chat-suggestions">
                <h3>Gợi ý nhanh</h3>
                <div class="suggestion-list">
                    <button class="suggest-btn">Tóm tắt ngắn tình hình công việc hiện tại trong 5 dòng</button>
                    <button class="suggest-btn">Có bao nhiêu công việc đang làm</button>
                    <button class="suggest-btn">Danh sách công việc</button>
                    <button class="suggest-btn">Danh sách nhân viên</button>
                    <button class="suggest-btn">Công việc chưa làm </button>
                </div>
            </div>
        </div>
    </div>

    <script src="chatbot.js"></script>
</body>

</html>
