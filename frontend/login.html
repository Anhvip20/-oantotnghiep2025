<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng nhập hệ thống</title>
  <link rel="stylesheet" href="login.css" />
</head>

<body class="login-page">
  <div class="container">
    <div class="card login-card">
      <h1>Đăng nhập hệ thống</h1>
      <p class="sub">Hệ thống quản lý công việc cho văn phòng</p>

      <label>Email</label>
      <input type="email" id="email" placeholder="Nhập email" value="bien@gmail.com" />

      <label>Mật khẩu</label>
      <div class="password-wrapper">
        <input type="password" id="matkhau" placeholder="Nhập mật khẩu" value="123456" />
        <button type="button" id="togglePassword" class="password-eye">👁️</button>
      </div>

      <button id="loginBtn">Đăng nhập</button>
      <p id="message" class="message"></p>
    </div>
  </div>

  <script src="login.js"></script>
</body>

</html>
